<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Lista de Tarefas</h1>

    <form id="form-tarefa">
      <input type="text" id="input-tarefa" placeholder="Digite uma tarefa" autocomplete="off">
      <button type="submit">Adicionar</button>
    </form>
    <p id="mensagem-erro" class="erro" hidden></p>

    <div class="filtros">
      <button data-filtro="todas" class="ativo">Todas</button>
      <button data-filtro="pendentes">Pendentes</button>
      <button data-filtro="concluidas">Concluídas</button>
    </div>

    <ul id="lista"></ul>
    <p id="contador"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
